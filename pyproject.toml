[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-protest-architect-skill"
version = "1.1.0"
description = "Skill and CLI toolkit for auditing federal procurement records and bid protest grounds under the FAR and 4 C.F.R. Part 21"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Project Contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
